name: UXQ Quality Gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # ─── 快速门禁：格式、契约、静态分析、类型检查、单元/集成/架构测试、构建 ───
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm contracts:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=test-results/unit.json
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-evidence
          path: test-results/
          if-no-files-found: warn

  # ─── 浏览器端到端测试：Playwright 真实浏览器采集与执行链路 ───
  browser-e2e:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  # ─── Golden 与回归测试：固定输入预期输出比对 ───
  golden:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run tests/golden --reporter=default
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-test-evidence
          path: tests/golden/__snapshots__/
          if-no-files-found: warn

  # ─── 合并门禁：所有阶段通过后标记成功 ───
  merge-gate:
    needs: [offline, browser-e2e, golden]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.offline.result }}" != "success" ]; then
            echo "::error::offline job failed"
            exit 1
          fi
          echo "All quality gates passed or are non-blocking (browser-e2e, golden)"
